<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morgul Outdoor — Pedidos Mayoristas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#f0f2f5;min-height:100vh}
header{background:#181c25;border-bottom:2px solid #2a3040;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:24px;font-weight:900;letter-spacing:2px;color:#e8a020}
.logo span{color:#f0f2f5;font-weight:300}
.cart-btn{background:#e8a020;color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit}
.badge{background:#000;color:#e8a020;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.top{padding:14px 16px 0}
.search{width:100%;background:#181c25;border:1.5px solid #2a3040;border-radius:10px;padding:11px 16px;color:#f0f2f5;font-size:15px;outline:none;font-family:inherit;margin-bottom:10px}
.search:focus{border-color:#e8a020}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.filters::-webkit-scrollbar{display:none}
.fb{background:#181c25;border:1.5px solid #2a3040;color:#8892a4;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;font-family:inherit}
.fb.on{background:#e8a020;color:#000;border-color:#e8a020;font-weight:700}
.info-bar{padding:0 16px 8px;font-size:12px;color:#8892a4}
.min-bar{margin:0 16px 12px;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;display:none}
.min-bar.show{display:flex}
.min-bar.bad{background:#2d0a0a;border:1.5px solid #ef4444}
.min-bar.good{background:#0a2d15;border:1.5px solid #22c55e}
.min-icon{font-size:20px;flex-shrink:0}
.min-txt b{display:block;margin-bottom:2px}
.min-txt small{font-weight:400;font-size:11px;opacity:.8}
.prog-wrap{height:6px;background:#2a3040;border-radius:20px;margin:0 16px 14px;display:none}
.prog-wrap.show{display:block}
.prog-fill{height:100%;border-radius:20px;transition:width .4s,background .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 16px 120px}
.card{background:#1e2330;border:1.5px solid #2a3040;border-radius:12px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#e8a020}
.card-img{height:100px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;background:#252b38}
.cat-tag{position:absolute;bottom:6px;left:6px;background:#e8a020;color:#000;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.new-tag{position:absolute;top:6px;right:6px;background:#22c55e;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px}
.card-body{padding:10px}
.p-code{font-size:10px;color:#e8a020;font-weight:700;margin-bottom:3px}
.p-name{font-size:12px;color:#f0f2f5;line-height:1.35;margin-bottom:8px;min-height:32px}
.p-price{font-size:19px;font-weight:900;color:#e8a020;margin-bottom:8px}
.p-price small{font-size:10px;color:#8892a4;font-weight:400}
.qty-row{display:flex;align-items:center;gap:6px}
.qb{background:#2a3040;border:none;color:#f0f2f5;width:28px;height:28px;border-radius:6px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:inherit}
.qb:active{background:#e8a020;color:#000}
.qi{background:#181c25;border:1.5px solid #2a3040;color:#f0f2f5;width:40px;text-align:center;padding:5px 2px;border-radius:6px;font-size:14px;outline:none;font-family:inherit}
.ab{flex:1;background:#e8a020;border:none;color:#000;padding:7px 4px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.ab.on{background:#22c55e;color:#fff}
.no-r{grid-column:1/-1;text-align:center;padding:60px 20px;color:#8892a4;font-size:15px}
/* PANEL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none}
.ov.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:#181c25;border-left:2px solid #2a3040;z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.panel.open{transform:translateX(0)}
.ph{padding:18px 20px;border-bottom:1px solid #2a3040;display:flex;justify-content:space-between;align-items:center}
.pt{font-size:20px;font-weight:900;color:#e8a020;letter-spacing:1px}
.xb{background:#2a3040;border:none;color:#f0f2f5;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.items{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.ci{background:#1e2330;border:1px solid #2a3040;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.ci-icon{font-size:24px;flex-shrink:0}
.ci-info{flex:1}
.ci-code{font-size:10px;color:#e8a020;font-weight:700}
.ci-name{font-size:12px;color:#f0f2f5;margin:2px 0 6px;line-height:1.3}
.ci-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ci-qty{font-size:11px;color:#8892a4}
.ci-sub{font-size:16px;font-weight:900;color:#e8a020}
.ci-del{background:none;border:none;color:#8892a4;cursor:pointer;font-size:18px;line-height:1;padding:2px;font-family:inherit}
.ci-del:hover{color:#ef4444}
.empty{text-align:center;padding:50px 20px;color:#8892a4;font-size:14px}
/* FORM */
.form-sec{padding:14px 16px;border-top:1px solid #2a3040}
.form-title{font-size:11px;font-weight:700;color:#8892a4;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:3px}
.flabel{font-size:10px;color:#8892a4}
.finput{background:#1e2330;border:1.5px solid #2a3040;color:#f0f2f5;padding:8px 10px;border-radius:7px;font-size:13px;outline:none;font-family:inherit}
.finput:focus{border-color:#e8a020}
.finput::placeholder{color:#3a4055}
/* FOOTER PANEL */
.pfoot{padding:14px 16px;border-top:1px solid #2a3040}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tl{font-size:13px;color:#8892a4;font-weight:600}
.ta{font-size:28px;font-weight:900;color:#e8a020}
.wa-btn{width:100%;background:#25D366;border:none;color:#fff;padding:14px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;font-family:inherit}
.cl-btn{width:100%;background:none;border:1.5px solid #2a3040;color:#8892a4;padding:10px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}
.cl-btn:hover{border-color:#ef4444;color:#ef4444}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
</style>
</head>

      <div class="field"><span class="flabel">Teléfono</span><input class="finput" id="fTel" placeholder="11 1234-5678"></div>
      <div class="field full"><span class="flabel">Dirección de entrega</span><input class="finput" id="fDir" placeholder="Calle, número, ciudad"></div>
      <div class="field"><span class="flabel">Forma de pago</span>
        <select class="finput" id="fPago">
          <option value="">Seleccionar...</option>
          <option>Transferencia</option>
          <option>Efectivo</option>
          <option>Cheque</option>
          <option>Mercado Pago</option>
          <option>Cuenta corriente</option>
        </select>
      </div>
      <div class="field"><span class="flabel">Observaciones</span><input class="finput" id="fObs" placeholder="Urgente, horario..."></div>
    </div>
  </div>
  <div class="pfoot">
    <div class="total-row"><span class="tl">TOTAL sin IVA</span><span class="ta" id="totalAmt">$0</span></div>

</div>

var cart = {};
var filt = 'todos';
var MIN = 700000;

function fmt(n){ return '$' + Math.round(n).toLocaleString('es-AR'); }
function $(id){ return document.getElementById(id); }

function render(){
  var q = $('srch').value.toLowerCase();
  var list = PRODS.filter(function(p){
    var mf = filt === 'todos' || p.cat === filt;
    var mq = !q || p.n.toLowerCase().indexOf(q) >= 0 || p.c.toLowerCase().indexOf(q) >= 0;
    return mf && mq;
  });
  $('infoBar').textContent = list.length + ' producto' + (list.length !== 1 ? 's' : '');
  if(!list.length){
    $('grid').innerHTML = '<div class="no-r">Sin resultados para "' + q + '"</div>';
    return;
  }
  var html = '';
  for(var i = 0; i < list.length; i++){
    var p = list[i];
    var id = 'q_' + p.c.replace(/[^a-zA-Z0-9]/g,'_');
    var added = !!cart[p.c];
    html += '<div class="card">';
    html += '<div class="card-img">';
    html += '<span class="cat-tag">' + p.cat + '</span>';
    if(p.nv) html += '<span class="new-tag">NUEVO</span>';
    html += '<span>' + p.e + '</span>';
    html += '</div>';
    html += '<div class="card-body">';
    html += '<div class="p-code">' + p.c + '</div>';
    html += '<div class="p-name">' + p.n + '</div>';
    html += '<div class="p-price">' + fmt(p.p) + ' <small>sin IVA</small></div>';
    html += '<div class="qty-row">';
    html += '<button class="qb" onclick="chg(\'' + p.c + '\',-1)">-</button>';
    html += '<input class="qi" type="number" min="1" value="' + (cart[p.c] ? cart[p.c].qty : 1) + '" id="' + id + '">';
    html += '<button class="qb" onclick="chg(\'' + p.c + '\',1)">+</button>';
    html += '<button class="ab' + (added ? ' on' : '') + '" onclick="add(\'' + p.c + '\')">' + (added ? 'OK' : '+') + '</button>';
    html += '</div></div></div>';
  }
  $('grid').innerHTML = html;
}

function chg(code, d){
  var id = 'q_' + code.replace(/[^a-zA-Z0-9]/g,'_');
  var el = document.getElementById(id);
  if(!el) return;
  var v = Math.max(1, (parseInt(el.value) || 1) + d);
  el.value = v;
  if(cart[code]){ cart[code].qty = v; renderCart(); }
}

function add(code){
  var id = 'q_' + code.replace(/[^a-zA-Z0-9]/g,'_');
  var el = document.getElementById(id);
  var qty = parseInt(el ? el.value : 1) || 1;
  var prod = null;
  for(var i = 0; i < PRODS.length; i++){ if(PRODS[i].c === code){ prod = PRODS[i]; break; } }
  if(!prod) return;
  if(cart[code]){ cart[code].qty += qty; } else { cart[code] = {c:prod.c,n:prod.n,p:prod.p,e:prod.e,qty:qty}; }
  render();
  renderCart();
  updateBadge();
}

function renderCart(){
  var its = Object.values(cart);
  if(!its.length){
    $('items').innerHTML = '<div class="empty">🛒<br><br>No agregaste productos</div>';
    $('totalAmt').textContent = '$0';
    updateMin(0);
    return;
  }
  var tot = 0;
  var html = '';
  for(var i = 0; i < its.length; i++){
    var it = its[i];
    var sub = it.p * it.qty;
    tot += sub;
    html += '<div class="ci">';
    html += '<div class="ci-icon">' + it.e + '</div>';
    html += '<div class="ci-info">';
    html += '<div class="ci-code">' + it.c + '</div>';
    html += '<div class="ci-name">' + it.n + '</div>';
    html += '<div class="ci-row"><span class="ci-qty">' + it.qty + ' x ' + fmt(it.p) + '</span><span class="ci-sub">' + fmt(sub) + '</span></div>';
    html += '</div>';
    html += '<button class="ci-del" onclick="del(\'' + it.c + '\')">x</button>';
    html += '</div>';
  }
  $('items').innerHTML = html;
  $('totalAmt').textContent = fmt(tot);
  updateMin(tot);
}

function updateMin(tot){
  var bar = $('minBar'), fill = $('progFill'), wrap = $('progWrap');
  var its = Object.values(cart);
  if(!its.length){ bar.className='min-bar'; wrap.className='prog-wrap'; return; }
  bar.className = 'min-bar show ' + (tot >= MIN ? 'good' : 'bad');
  wrap.className = 'prog-wrap show';
  var pct = Math.min(100, Math.round(tot/MIN*100));
  fill.style.width = pct + '%';
  fill.style.background = tot >= MIN ? '#22c55e' : (pct > 60 ? '#e8a020' : '#ef4444');
  $('minIcon').textContent = tot >= MIN ? '✅' : '⚠️';
  $('minMsg').textContent = tot >= MIN ? 'Superas la compra minima!' : 'No llegas a la compra minima... segui comprando';
  $('minSub').textContent = tot >= MIN ? 'Podes enviar el pedido' : 'Te faltan ' + fmt(MIN - tot) + ' para el minimo de $700.000';
}

function del(code){ delete cart[code]; render(); renderCart(); updateBadge(); }
function clearCart(){ if(!confirm('Limpiar pedido?')) return; cart={}; render(); renderCart(); updateBadge(); }
function updateBadge(){ $('badge').textContent = Object.values(cart).reduce(function(s,i){return s+i.qty;},0); }
function setF(f,btn){ filt=f; document.querySelectorAll('.fb').forEach(function(b){b.className='fb';}); btn.className='fb on'; render(); }
function togglePanel(){ $('panel').classList.toggle('open'); $('ov').classList.toggle('open'); }

function sendWA(){
  var its = Object.values(cart);
  if(!its.length){ alert('Agrega productos primero.'); return; }
  var tot = its.reduce(function(s,i){return s+i.p*i.qty;},0);
  if(tot < MIN){ alert('No llegas a la compra minima de $700.000 sin IVA.\n\nTenes: ' + fmt(tot) + '\nTe faltan: ' + fmt(MIN-tot)); return; }
  var nombre = $('fNombre').value.trim();
  if(!nombre){ alert('Ingresa el nombre del cliente.'); $('fNombre').focus(); return; }
  var lines = ['PEDIDO MORGUL OUTDOOR\n'];
  lines.push('Cliente: ' + nombre);
  if($('fCuit').value) lines.push('CUIT/DNI: ' + $('fCuit').value);
  if($('fTel').value) lines.push('Tel: ' + $('fTel').value);
  if($('fDir').value) lines.push('Direccion: ' + $('fDir').value);
  if($('fPago').value) lines.push('Pago: ' + $('fPago').value);
  lines.push('\nPRODUCTOS:');
  its.forEach(function(it){
    lines.push('- ' + it.c + ' | ' + it.n + '\n  ' + it.qty + ' u x ' + fmt(it.p) + ' = ' + fmt(it.p*it.qty));
  });
  lines.push('\nTOTAL (sin IVA): ' + fmt(tot));
  if($('fObs').value) lines.push('\nObs: ' + $('fObs').value);
  window.open('https://wa.me/5491130234049?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

render();
</script>
